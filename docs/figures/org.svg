<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Helvetica, Arial, sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.6"/></marker></defs><rect width="900" height="620" fill="white"/><rect x="340" y="20" width="220" height="50" rx="8" fill="#F8EEDC" stroke="#EAD9B8"/><text x="450.0" y="39.0" text-anchor="middle" font-weight="bold" fill="#111">Founder</text><text x="450.0" y="57.0" text-anchor="middle" font-size="11" fill="#555">gates: rules, spend, autonomy, architecture</text><rect x="340" y="110" width="220" height="50" rx="8" fill="#E3EEE4" stroke="#79A98A"/><text x="450.0" y="129.0" text-anchor="middle" font-weight="bold" fill="#111">Manager (@manager)</text><text x="450.0" y="147.0" text-anchor="middle" font-size="11" fill="#555">specs, assignment, merges, digest</text><rect x="40" y="110" width="220" height="50" rx="8" fill="#EEEAF5" stroke="#B9AADB"/><text x="150.0" y="129.0" text-anchor="middle" font-weight="bold" fill="#111">Architect (@architect)</text><text x="150.0" y="147.0" text-anchor="middle" font-size="11" fill="#555">owns docs/design, fit; GPT-6</text><rect x="640" y="110" width="220" height="50" rx="8" fill="#EEEAF5" stroke="#B9AADB"/><text x="750.0" y="129.0" text-anchor="middle" font-weight="bold" fill="#111">Spec reviewer</text><text x="750.0" y="147.0" text-anchor="middle" font-size="11" fill="#555">correctness, 4 rounds; GPT-6</text><rect x="80" y="220" width="740" height="64" rx="12" fill="none" stroke="#1D9E75" stroke-width="1.6"/><text x="450" y="244" font-size="13" fill="#111" text-anchor="middle">#dev: track threads (logged to the repo)</text><text x="450" y="266" font-size="11" fill="#555" text-anchor="middle">@all-in-channel with one assignee; anyone may contribute [aside]; non-assignees never execute</text><rect x="40" y="340" width="200" height="50" rx="8" fill="#E3EEE4" stroke="#79A98A"/><text x="140.0" y="359.0" text-anchor="middle" font-weight="bold" fill="#111">Coder (@coder)</text><text x="140.0" y="377.0" text-anchor="middle" font-size="11" fill="#555">dev VM, coding loops</text><rect x="260" y="340" width="200" height="50" rx="8" fill="#E3EEE4" stroke="#79A98A"/><text x="360.0" y="359.0" text-anchor="middle" font-weight="bold" fill="#111">Simba (@simba)</text><text x="360.0" y="377.0" text-anchor="middle" font-size="11" fill="#555">MacBook, iOS UI dev and test</text><rect x="480" y="340" width="170" height="50" rx="8" fill="#F3F3F1" stroke="#BBB"/><text x="565.0" y="359.0" text-anchor="middle" font-weight="bold" fill="#111">Machine supervisors</text><text x="565.0" y="377.0" text-anchor="middle" font-size="11" fill="#555">scripts, no LLM</text><rect x="670" y="340" width="190" height="50" rx="8" fill="#F3F3F1" stroke="#BBB"/><text x="765.0" y="359.0" text-anchor="middle" font-weight="bold" fill="#111">On-call agents</text><text x="765.0" y="377.0" text-anchor="middle" font-size="11" fill="#555">Hermes, Simba</text><rect x="150" y="460" width="260" height="50" rx="8" fill="#F3F3F1" stroke="#BBB"/><text x="280.0" y="479.0" text-anchor="middle" font-weight="bold" fill="#111">Verifiers</text><text x="280.0" y="497.0" text-anchor="middle" font-size="11" fill="#555">exit harnesses, judges: evidence only</text><rect x="490" y="460" width="300" height="50" rx="8" fill="#F3F3F1" stroke="#BBB"/><text x="640.0" y="479.0" text-anchor="middle" font-weight="bold" fill="#111">Repo: state, runs, evidence, knowledge</text><text x="640.0" y="497.0" text-anchor="middle" font-size="11" fill="#555">the record; PRs and gates</text><line x1="440" y1="70" x2="440" y2="106" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="460" y1="110" x2="460" y2="74" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="450" y1="160" x2="450" y2="216" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="150" y1="160" x2="150" y2="216" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="750" y1="160" x2="750" y2="216" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="260" y1="135" x2="336" y2="135" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="140" y1="284" x2="140" y2="336" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="360" y1="284" x2="360" y2="336" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="565" y1="284" x2="565" y2="336" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="765" y1="284" x2="765" y2="336" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="565" y1="390" x2="565" y2="456" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="140" y1="390" x2="140" y2="456" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="490" y1="485" x2="414" y2="485" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><text x="450" y="565" font-size="11" fill="#555" text-anchor="middle">Later: #marketing, #sales, #pr with Hermes / OpenClaw as producers on the same loop shape (proposer, reviewer, producer, verifier, gates).</text><text x="450" y="587" font-size="11" fill="#555" text-anchor="middle">Verifiers read the repo, not the thread; their verdicts return to the thread.</text></svg>