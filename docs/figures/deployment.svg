Simba (OpenClaw)</text><rect x="35" y="410" width="240" height="50" rx="8" fill="#E3EEE4" stroke="#79A98A"/><text x="155.0" y="429.0" text-anchor="middle" font-weight="bold" fill="#111">iOS UI dev and testing</text><text x="155.0" y="447.0" text-anchor="middle" font-size="11" fill="#555">Xcode, simulator, device, Safari, voice</text><rect x="35" y="470" width="240" height="44" rx="8" fill="#F3F3F1" stroke="#BBB"/><text x="155.0" y="486.0" text-anchor="middle" font-weight="bold" fill="#111">on-call agent</text><text x="155.0" y="504.0" text-anchor="middle" font-size="11" fill="#555">for the MacBook</text><rect x="310" y="380" width="270" height="150" rx="12" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/><text x="445.0" y="400" font-size="13" fill="#111" text-anchor="middle">iMac: Hermes</text><rect x="325" y="410" width="240" height="50" rx="8" fill="#EEEAF5" stroke="#B9AADB"/><text x="445.0" y="429.0" text-anchor="middle" font-weight="bold" fill="#111">Architect + spec reviewer</text><text x="445.0" y="447.0" text-anchor="middle" font-size="11" fill="#555">GPT-6 via Codex</text><rect x="325" y="470" width="240" height="44" rx="8" fill="#F3F3F1" stroke="#BBB"/><text x="445.0" y="486.0" text-anchor="middle" font-weight="bold" fill="#111">on-call agent</text><text x="445.0" y="504.0" text-anchor="middle" font-size="11" fill="#555">for the iMac</text><rect x="600" y="380" width="280" height="150" rx="12" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/><text x="740.0" y="400" font-size="13" fill="#111" text-anchor="middle">Later: department instances</text><rect x="615" y="410" width="250" height="50" rx="8" fill="#EEEAF5" stroke="#B9AADB"/><text x="740.0" y="429.0" text-anchor="middle" font-weight="bold" fill="#111">Hermes / OpenClaw as assistants</text><text x="740.0" y="447.0" text-anchor="middle" font-size="11" fill="#555">marketing, sales, PR</text><rect x="615" y="470" width="250" height="44" rx="8" fill="#F3F3F1" stroke="#BBB"/><text x="740.0" y="486.0" text-anchor="middle" font-weight="bold" fill="#111">own channels, own evidence</text><text x="740.0" y="504.0" text-anchor="middle" font-size="11" fill="#555">same loop shape</text><line x1="120" y1="100" x2="120" y2="196" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="440" y1="150" x2="440" y2="196" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="470" y1="196" x2="470" y2="154" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="660" y1="72" x2="676" y2="72" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="450" y1="254" x2="450" y2="280" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="155" y1="330" x2="155" y2="376" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="445" y1="330" x2="445" y2="376" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><line x1="740" y1="254" x2="740" y2="376" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><text x="450" y="570" font-size="11" fill="#555" text-anchor="middle">Slack and GitHub carry everything; no machine talks to another. The dev VM is the only always-on node; MacAir can be closed.</text><text x="450" y="592" font-size="11" fill="#555" text-anchor="middle">Identity is the bridge, not the model: behind @manager the supervisor switches Claude Code and Codex on quota.</text></svg>